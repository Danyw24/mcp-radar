name: Monitor Vulnerabilities

on:
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas (techo de costo: 4 corridas/dia, no 96)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false # Don't cancel - avoid state corruption

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read repos config
        id: repos
        run: |
          echo "json<<REPOS_EOF" >> "$GITHUB_OUTPUT"
          cat repos.json >> "$GITHUB_OUTPUT"
          echo "REPOS_EOF" >> "$GITHUB_OUTPUT"

      - uses: spaceraccoon/vulnerability-spoiler-alert-action@786e11ad1487b405eb6f74590630d7dd6ab20975
        with:
          api-key: ${{ secrets.API_KEY }}
          provider: openai-compatible
          base-url: https://openrouter.ai/api/v1
          model: anthropic/claude-haiku-4.5
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-repo: ${{ github.repository }}
          repositories: ${{ steps.repos.outputs.json }}
          enable-repo-context: true
          enable-judge: true
          triage-model: deepseek/deepseek-v4-flash
          judge-model: deepseek/deepseek-v4-flash

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .vulnerability-spoiler-state.json
          git diff --staged --quiet || git commit -m "chore: update vulnerability monitor state"
          git push
